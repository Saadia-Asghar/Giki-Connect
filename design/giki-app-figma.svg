<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="393" height="1200" viewBox="0 0 393 1200">
  <title>GIKI-Connect app  import into Figma</title>
  <desc>Matches web/styles.css tokens. File ’ Import in Figma. Preview: http://127.0.0.1:8765/design-preview</desc>

  <defs>
    <linearGradient id="glow1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <g id="Frame / Mobile / GIKI-Connect">
    <rect width="393" height="1200" fill="#0c1222"/>
    <ellipse cx="80" cy="-40" rx="200" ry="180" fill="url(#glow1)"/>
    <ellipse cx="360" cy="40" rx="160" ry="140" fill="#6366f1" opacity="0.08"/>

    <g id="Header">
      <rect x="24" y="56" rx="999" width="268" height="28" fill="rgba(45,212,191,0.15)" stroke="#2a3555"/>
      <text x="36" y="75" fill="#2dd4bf" font-family="DM Sans, system-ui, sans-serif" font-size="10" font-weight="700" letter-spacing="0.12em">K-MEANS · NOTEBOOK PIPELINE</text>
      <text x="24" y="118" fill="#e8ecf4" font-family="DM Sans, system-ui, sans-serif" font-size="26" font-weight="700">GIKI-Connect</text>
      <text x="24" y="158" fill="#8b95b0" font-family="DM Sans, system-ui, sans-serif" font-size="13">Pick hobbies &amp; sliders  map to an interest tribe.</text>
    </g>

    <g id="Card / Hobbies">
      <rect x="20" y="196" width="353" height="280" rx="16" fill="#1a2340" stroke="#2a3555"/>
      <text x="36" y="228" fill="#8b95b0" font-family="DM Sans, system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="0.06em">HOBBIES</text>
      <text x="36" y="252" fill="#8b95b0" font-family="DM Sans, system-ui, sans-serif" font-size="12">Select all that apply (at least one).</text>
      <g id="Pills row 1" fill="none">
        <rect x="36" y="268" rx="999" width="56" height="30" fill="#141b2e" stroke="#2dd4bf"/>
        <text x="48" y="288" fill="#e8ecf4" font-family="DM Sans, system-ui, sans-serif" font-size="11">Music</text>
        <rect x="100" y="268" rx="999" width="44" height="30" fill="#141b2e" stroke="#2a3555"/>
        <text x="110" y="288" fill="#8b95b0" font-family="DM Sans, system-ui, sans-serif" font-size="11">Art</text>
        <rect x="152" y="268" rx="999" width="72" height="30" fill="#141b2e" stroke="#2a3555"/>
        <text x="162" y="288" fill="#8b95b0" font-family="DM Sans, system-ui, sans-serif" font-size="11">Cooking</text>
        <rect x="232" y="268" rx="999" width="64" height="30" fill="#141b2e" stroke="#2a3555"/>
        <text x="242" y="288" fill="#8b95b0" font-family="DM Sans, system-ui, sans-serif" font-size="11">Fitness</text>
      </g>
      <g id="Pills row 2">
        <rect x="36" y="308" rx="999" width="78" height="30" fill="#141b2e" stroke="#2a3555"/>
        <text x="46" y="328" fill="#8b95b0" font-family="DM Sans, system-ui, sans-serif" font-size="11">Football</text>
        <rect x="122" y="308" rx="999" width="62" height="30" fill="#141b2e" stroke="#2a3555"/>
        <text x="132" y="328" fill="#8b95b0" font-family="DM Sans, system-ui, sans-serif" font-size="11">Gaming</text>
        <rect x="192" y="308" rx="999" width="140" height="30" fill="#141b2e" stroke="#2dd4bf"/>
        <text x="202" y="328" fill="#e8ecf4" font-family="DM Sans, system-ui, sans-serif" font-size="10">Coding / Programming</text>
      </g>
    </g>

    <g id="Card / Social context">
      <rect x="20" y="492" width="353" height="320" rx="16" fill="#1a2340" stroke="#2a3555"/>
      <text x="36" y="524" fill="#8b95b0" font-family="DM Sans, system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="0.06em">SOCIAL CONTEXT</text>
      <text x="36" y="556" fill="#8b95b0" font-family="DM Sans, system-ui, sans-serif" font-size="12">Society hours / week</text>
      <text x="300" y="556" fill="#2dd4bf" font-family="DM Sans, system-ui, sans-serif" font-size="12" font-weight="600">3 h/wk</text>
      <rect x="36" y="568" width="305" height="6" rx="3" fill="#141b2e"/>
      <rect x="36" y="568" width="120" height="6" rx="3" fill="#2dd4bf"/>
      <text x="36" y="612" fill="#8b95b0" font-family="DM Sans, system-ui, sans-serif" font-size="12">Comfort (15)</text>
      <text x="320" y="612" fill="#2dd4bf" font-family="DM Sans, system-ui, sans-serif" font-size="12" font-weight="600">4</text>
      <rect x="36" y="624" width="305" height="6" rx="3" fill="#141b2e"/>
      <rect x="36" y="624" width="200" height="6" rx="3" fill="#2dd4bf"/>
      <text x="36" y="668" fill="#8b95b0" font-family="DM Sans, system-ui, sans-serif" font-size="12">Same province friends %</text>
      <text x="300" y="668" fill="#2dd4bf" font-family="DM Sans, system-ui, sans-serif" font-size="12" font-weight="600">50%</text>
      <rect x="36" y="680" width="305" height="6" rx="3" fill="#141b2e"/>
      <rect x="36" y="680" width="152" height="6" rx="3" fill="#2dd4bf"/>
      <rect x="36" y="716" width="305" height="48" rx="12" fill="#2dd4bf"/>
      <text x="130" y="746" fill="#042f2e" font-family="DM Sans, system-ui, sans-serif" font-size="15" font-weight="700">Find my tribe</text>
    </g>

    <g id="Card / Result (example)">
      <rect x="20" y="836" width="353" height="220" rx="16" fill="#1a2340" stroke="#2a3555"/>
      <text x="36" y="868" fill="#8b95b0" font-family="DM Sans, system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="0.06em">YOUR MATCH</text>
      <text x="36" y="902" fill="#e8ecf4" font-family="DM Sans, system-ui, sans-serif" font-size="18" font-weight="700">Tribe 2  Gaming &amp; Music</text>
      <text x="36" y="928" fill="#8b95b0" font-family="DM Sans, system-ui, sans-serif" font-size="11">Silo index 0.55  High (siloed)</text>
      <rect x="36" y="944" width="305" height="8" rx="4" fill="#141b2e"/>
      <rect x="36" y="944" width="168" height="8" rx="4" fill="#2dd4bf"/>
      <rect x="36" y="972" width="72" height="26" rx="8" fill="#141b2e" stroke="#2a3555"/>
      <text x="48" y="990" fill="#8b95b0" font-family="DM Sans, system-ui, sans-serif" font-size="10">Gaming</text>
      <rect x="116" y="972" width="64" height="26" rx="8" fill="#141b2e" stroke="#2a3555"/>
      <text x="126" y="990" fill="#8b95b0" font-family="DM Sans, system-ui, sans-serif" font-size="10">Music</text>
      <rect x="36" y="1008" width="305" height="36" rx="12" fill="rgba(45,212,191,0.15)" stroke="rgba(45,212,191,0.35)"/>
      <text x="48" y="1030" fill="#e8ecf4" font-family="DM Sans, system-ui, sans-serif" font-size="11">Recommendation copy&</text>
    </g>

    <g id="Tokens / legend" opacity="0.85">
      <rect x="20" y="1088" width="353" height="88" rx="12" fill="#141b2e" stroke="#2a3555"/>
      <text x="32" y="1112" fill="#8b95b0" font-family="DM Sans, system-ui, sans-serif" font-size="9" font-weight="700">DESIGN TOKENS (web/styles.css)</text>
      <text x="32" y="1132" fill="#8b95b0" font-family="DM Sans, system-ui, sans-serif" font-size="9">bg #0c1222 · card #1a2340 · surface #141b2e · border #2a3555</text>
      <text x="32" y="1148" fill="#8b95b0" font-family="DM Sans, system-ui, sans-serif" font-size="9">text #e8ecf4 · muted #8b95b0 · accent #2dd4bf · radius 16px</text>
      <text x="32" y="1164" fill="#2dd4bf" font-family="DM Sans, system-ui, sans-serif" font-size="9">Import: design/giki-app-figma.svg</text>
    </g>
  </g>
</svg>
